# Maximal gleichzeitig laufende Welten; hartes Maximum: 3.
max-running: 2
slots:
  - vipworld-1
  - vipworld-2
  # - vipworld-3 # Optionaler dritter Slot

# Survival ist fest reserviert und hat Vorrang vor VIP-Welten.
ram:
  total-mb: 20480
  reserved-mb: 4096 # Docker/VM
  survival-reserved-mb: 5120
  fixed-services-mb:
    lobby: 2048
    velocity: 768
    db: 768
    bot+playit: 256
    pvp: 1280
  per-world-mb: 1536
  heap-mb: 1152 # ~380 MB Non-Heap-Puffer im 1536m-Limit (siehe pvp #53)

start-timeout-seconds: 180
idle-minutes: 10
join-grace-seconds: 120
names:
  min: 3
  max: 24
  pattern: '[A-Za-z0-9_-]'
types: [normal, flat, void]

# Werte aus LuckPerms-Meta; ohne Meta jeweils 0.
perks:
  slots:
    meta-key: vipworlds.slots
    default: 0
  queue-priority:
    meta-key: vipworlds.queue-priority
    default: 0

# TODO: Hook fuer Rangablauf; Entscheidung zu Frage 11 steht noch aus.
expiry:
  # Noch keine Aktion festgelegt.

# Spielerlimit pro laufender Welt. Hartes Maximum: 15 (players.max wird darauf begrenzt).
players:
  vip: 5
  mvp: 10
  admin: 10
  max: 15

# Admin-Weltplaetze, wenn LuckPerms kein vipworlds.slots-Meta setzt.
admin-slots: 3

# Pro Welt waehlbare Addons (siehe scripts/vip-worlds-rework.sql).
addons:
  max: 3
  catalog: [keep-inventory, peaceful, creative, day-lock, pvp]

# Start-Fortschritt: Abfrageintervall, Timeout, aufeinanderfolgende Host-Fehler.
start-poll-seconds: 2
start-max-errors: 5
# Vertraute Mitglieder duerfen die Welt starten.
trusted-may-start: true
