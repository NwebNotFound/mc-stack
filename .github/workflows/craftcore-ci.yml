name: CraftCore CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.8.2'
      - run: gradle clean build --no-daemon
        working-directory: plugins-src/craftcore
  db-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check scripts for DB credentials on the command line
        run: python3 tools/check-db-credentials.py
      - name: Run the scanner regression tests
        run: python3 tools/test_check_db_credentials.py
      - name: Maintenance script tests (backup.ps1, dev-reset.ps1; mocked docker)
        shell: pwsh
        run: ./tools/test-maintenance.ps1
