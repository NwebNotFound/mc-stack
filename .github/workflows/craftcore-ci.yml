name: CraftCore CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push cancels the old PR run (main runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Which parts changed (PRs only; on main everything runs). Skipped jobs count as passed for required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      build: ${{ steps.f.outputs.build }}
      bot: ${{ steps.f.outputs.bot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          build=true; bot=true
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            files=$(git diff --name-only "$BASE_SHA" HEAD)
            echo "$files" | grep -qE '^(plugins-src/|bot/plugin/|\.github/workflows/)' || build=false
            echo "$files" | grep -qE '^(bot/|\.github/workflows/)' || bot=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"; echo "bot=$bot" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: bot/plugin/pom.xml
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.8.2'
      - run: gradle clean build --no-daemon
        working-directory: plugins-src/craftcore
      # DiscordLink plugin (bot/plugin, Maven, Paper API from repo.papermc.io): was never compiled in CI
      # (audit #165). ParkourBridge needs jars that exist only on the server (data/lobby), so it is
      # built on the host before deploy, not here.
      - name: Build DiscordLink plugin
        run: mvn -B -q package
        working-directory: bot/plugin
  db-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check scripts for DB credentials on the command line
        run: python3 tools/check-db-credentials.py
      - name: Run the scanner regression tests
        run: python3 tools/test_check_db_credentials.py
      - name: Maintenance script tests (backup.ps1, dev-reset.ps1; mocked docker)
        shell: pwsh
        run: ./tools/test-maintenance.ps1
      - name: Watchdog tests (tools/watchdog; mocked docker and scheduled tasks)
        shell: pwsh
        run: ./tools/test-watchdog.ps1
  bot-tests:
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install bot dependencies
        run: pip install -r bot/requirements.txt pytest
      - name: Data dir the bot expects (the tests write below /app)
        run: sudo mkdir -p /app/data && sudo chown -R "$USER" /app
      - name: Bot tests (bot/test_*.py)
        run: python -m pytest -q
        working-directory: bot
