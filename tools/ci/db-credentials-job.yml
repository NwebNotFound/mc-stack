# Fertiger CI-Job fuer .github/workflows/craftcore-ci.yml (unter "jobs:" einfuegen).
# Konnte nicht direkt gepusht werden: dem Token fehlt der GitHub-Scope "workflow".
  db-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check scripts for DB credentials on the command line
        run: python3 tools/check-db-credentials.py
