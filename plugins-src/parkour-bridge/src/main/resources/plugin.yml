name: ParkourBridge
version: 1.0.0
main: de.mcstack.parkour.ParkourBridge
api-version: '26.3'
depend: [Lobby-Parkour]
commands:
  cc:
    description: CraftCore administration
    permission: craftcore.holo.admin
  parkour:
    description: Parkour verlassen oder Bestenliste platzieren
    usage: /parkour leave|setboard|times|reset|removetime|resetall

permissions:
  craftcore.parkour.admin:
    default: op
  craftcore.holo.admin:
    default: op
