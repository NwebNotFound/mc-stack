# Rueckkehr zum letzten Checkpoint erst, wenn der Spieler so viele Bloecke unter dem tiefsten Kurspunkt
# (Start, Checkpoints, Ziel) ist. Kurze Spruenge nach unten sind damit erlaubt.
fall-distance-below-floor: 4.0
# Ruecksetzen bei harten Landungen ueber dieser Fallhoehe in Bloecken (0 = aus).
hard-landing-reset-blocks: 0
# Wasser-Ruecksetzung: feet = Fuesse im Wasser, touch = jede Beruehrung, off = aus.
water-reset: feet
# Optionale absolute Y-Grenzen pro Kurs (Kursnamen ohne Beachtung der Gross-/Kleinschreibung).
# Beispiel: course-floors: {"Cave Rush": -60}
# Ohne Eintrag gilt die berechnete Grenze; nach Aenderungen Konfiguration neu laden.
course-floors: {}
# Mit /parkour setboard setzen. Koordinaten werden in dieser Datei gespeichert.
