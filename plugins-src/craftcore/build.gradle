plugins { id 'java' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
def serverLibs = fileTree(dir: '../../data/survival/libraries', include: '**/*.jar')
def vaultJar = file('libs/VaultAPI-1.7.jar')
def vaultSha256 = '47f6a400a8ab22012e6a320f7bfc63621ce4a246e1c60502ff7fc91d532d2601'
tasks.register('verifyVaultApi') {
    inputs.file(vaultJar)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(vaultJar.bytes).encodeHex().toString()
        if (digest != vaultSha256) throw new GradleException('VaultAPI-1.7.jar SHA-256 mismatch')
    }
}
tasks.withType(JavaCompile).configureEach { dependsOn tasks.named('verifyVaultApi') }
dependencies {
    compileOnly 'net.luckperms:api:5.4'
    testImplementation 'net.luckperms:api:5.4'
    if (!serverLibs.files.isEmpty()) {
        compileOnly serverLibs
        testImplementation serverLibs
    } else {
        compileOnly 'io.papermc.paper:paper-api:26.3.build.231-stable'
        testImplementation 'io.papermc.paper:paper-api:26.3.build.231-stable'
    }
    compileOnly files(vaultJar)
    testImplementation files(vaultJar)
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2:2.3.232'
}
test { useJUnitPlatform() }
jar { duplicatesStrategy = DuplicatesStrategy.EXCLUDE; from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }; exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA' }
