name: CraftCore
version: 0.1.1
main: de.mcstack.craftcore.CraftCore
api-version: '26.3'
depend: [Vault]
softdepend: [LuckPerms, Citizens]
commands:
  rank:
    description: Rang setzen
    usage: /rank set <spieler> <rang>
    permission: craftcore.rank.set
  cc:
    description: CraftCore Administration
  ccportal:
    description: Portale verwalten
    permission: craftcore.portal.admin
  sidebar:
    description: Sidebar ein- oder ausschalten
    aliases: [sb]
  cclaunch:
    description: LaunchPads verwalten
    usage: /cclaunch <list|reload|set <id> [targetX targetY targetZ]|remove <id>|target <id>>
    permission: craftcore.launch.admin
  cclink:
    description: Discord-Verknuepfung setzen (Konsole)
  stats:
    description: Statistik und kosmetische Abzeichen
  challenges:
    description: Tages- und Wochenaufgaben
  servermode:
    description: Servermodus setzen (nur OP)
    usage: /servermode <dev|online|wartung>
  menu:
    description: Zentrales Men?
  help:
    description: Kategorien und Hilfe
  abholen:
    description: Offene Lieferungen abholen
  feedback:
    description: Link zu Feedback und Bugs
  balance:
    description: CP-Kontostand
    aliases: [bal, geld]
  pay:
    description: CP an Spieler senden
    usage: /pay <Spieler> <Betrag>
  team:
    description: Teamverwaltung
    usage: /team create|invite|join|leave|kick|info|promote|demote|color

  claim:
    description: Chunk beanspruchen oder auflisten
  unclaim:
    description: Chunk freigeben
  spawn:
    description: Zum Lobby-Spawn teleportieren
  home:
    description: Zu einem Zuhause teleportieren
  tpteam:
    description: Teleport zu Teammitgliedern auf Survival
  vip:
    description: VIP-Menue
  sethome:
    description: Zuhause setzen

  bank:
    aliases: [money]
    description: Bank und Warenhandel
  verkaufen:
    description: Gegenstaende an die Bank verkaufen
    aliases: [sell]
  market:
    description: Marktpreise und Trend

  shop:
    aliases: [markt]
    description: Spielershops
    usage: /shop help

  ah:
    description: Auktionshaus
    usage: /ah

  testrun:
    description: Test-CP nur fuer Konten ...c0de0001 und ...c0de0002 (Konsole/RCON)
    usage: /testrun <uuid> <cent> <idem_key>

  trade:
    description: Handel zwischen Spielern
    usage: /trade <spieler>|accept

  npc:
    description: Lobby-NPC setzen
    usage: /npc set bank|ah
    permission: craftcore.npc.set
  mr:
    description: MineRush Loot-Editor
    permission: craftcore.minerush.edit
permissions:
  craftcore.rank.set:
    default: op
  craftcore.admin.npc:
    default: op
  craftcore.admin:
    default: op
  craftcore.portal.admin:
    default: op
  craftcore.launch.admin:
    description: LaunchPads verwalten
    default: op
  craftcore.minerush.edit:
    description: MineRush bearbeiten
    default: op
  craftcore.npc.set:
    description: NPCs setzen
    default: op
  craftcore.end.bypass:
    description: End-Sperre fuer Ops umgehen
    default: op
