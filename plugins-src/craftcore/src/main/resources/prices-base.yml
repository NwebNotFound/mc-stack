# CraftCore-Preisliste (Rohwert in CP je Stueck). Bank: Kauf = Rohwert*base-factor*buy-factor, Ankauf = 50 % des Kaufpreises.
# Stufung: Erde < Kupfer < Eisen < Gold < Diamant < Netherite; End-Items/Shulker hoch.
# Kupfer: Kaufpreis Eisenbarren / Ankauf Kupferbarren = 8-10. Rezepte: Produkt >= guenstigstes Rezept, Schmelzen x1.3,
# und hoechstens 2x Rezeptkosten (sonst Kaufen+Craften+Verkaufen mit Gewinn).
# Farbige Shulker-Boxen = SHULKER_BOX + Farbstoff. Alle handelbaren Items haben einen expliziten Preis (kein Fallback).
# Erzeugt aus minecraft-data 26.1 (+ Schmelz-/Schmiederezepte); Pruefung: RecipeArbitrageTest.

# Stichtag, ab dem diese Preise gelten (ISO-8601 mit Zone). PLATZHALTER - wird beim Deploy gesetzt.
# Stichtag der neuen Basispreise (ISO 8601 mit Zone). 1970-01-01T00:00:00Z waere "nicht gesetzt". Landet in price_meta bzw. v_price_meta.effective_from (DATETIME, UTC).
effective_from: "2026-10-30T15:00:00+01:00"

