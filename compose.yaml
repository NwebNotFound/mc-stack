name: mc-stack

x-paper-environment: &paper-environment
  EULA: "TRUE"
  TYPE: PAPER
  VERSION: "${MINECRAFT_VERSION:-LATEST}"
  ONLINE_MODE: "FALSE"
  ENFORCE_SECURE_PROFILE: "FALSE"
  ENABLE_WHITELIST: "TRUE"
  ENFORCE_WHITELIST: "TRUE"
  ENABLE_RCON: "TRUE"
  RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD fehlt in .env}"
  RCON_PORT: "25575"
  ENABLE_QUERY: "FALSE"
  CFG_FORWARDING_SECRET_FILE: /run/secrets/forwarding_secret
  REPLACE_ENV_DURING_SYNC: "TRUE"
  REPLACE_ENV_IN_PLACE: "FALSE"
  SYNC_SKIP_NEWER_IN_DESTINATION: "FALSE"
  COPY_CONFIG_DEST: /data
  TZ: Europe/Berlin
  CRAFTCORE_DB_PASSWORD: "${CRAFTCORE_DB_PASSWORD:?CRAFTCORE_DB_PASSWORD fehlt}"
  LUCKPERMS_STORAGE_METHOD: mariadb
  LUCKPERMS_DATA_ADDRESS: craftcore-db:3306
  LUCKPERMS_DATA_DATABASE: luckperms
  LUCKPERMS_DATA_USERNAME: "${LUCKPERMS_DB_USER:?LUCKPERMS_DB_USER fehlt}"
  LUCKPERMS_DATA_PASSWORD: "${LUCKPERMS_DB_PASSWORD:?LUCKPERMS_DB_PASSWORD fehlt}"
  LUCKPERMS_MESSAGING_SERVICE: sql

x-paper: &paper
  image: itzg/minecraft-server:latest
  restart: unless-stopped
  stop_grace_period: 2m
  networks: [minecraft]
  secrets: [forwarding_secret]
  healthcheck:
    test: ["CMD", "mc-health"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 5m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  craftcore-db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: craftcore
      MARIADB_USER: craftcore
      MARIADB_PASSWORD: "${CRAFTCORE_DB_PASSWORD:?CRAFTCORE_DB_PASSWORD fehlt}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - craftcore-db:/var/lib/mysql
    networks: [minecraft]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  lobby:
    <<: *paper
    depends_on:
      craftcore-db:
        condition: service_healthy
    environment:
      <<: *paper-environment
      MEMORY: 1G
      CRAFTCORE_SERVER: Lobby
      MC_INGEST_TOKEN: "${MC_INGEST_TOKEN:-}"
      VIP_WEB_QUEUE: "${VIP_WEB_QUEUE:-0}"
      PVP_HOST_URL: http://host.docker.internal:25599
      PVP_HOST_TOKEN: "${PVP_HOST_TOKEN:-}"
      VIP_HOST_URL: http://host.docker.internal:25599
      VIP_HOST_TOKEN: "${VIP_HOST_TOKEN:-}"
      VIP_CONFIG: /config-vip/vipworlds.yml
      MOTD: MC Stack Lobby
      MODE: adventure
      DIFFICULTY: easy
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      SPAWN_PROTECTION: "0"
      LEVEL_TYPE: minecraft:flat
      GENERATOR_SETTINGS: '{"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"structures":{}}'
      GENERATE_STRUCTURES: "FALSE"
      COPY_PLUGINS_SRC: /lobby-plugins,/bot-plugin
    volumes:
      - ./data/lobby:/data
      - ./config/lobby-paper:/config:ro
      - ./config/vipworlds.yml:/config-vip/vipworlds.yml:ro
      - ./config/lobby-plugins:/lobby-plugins:ro
      - bot-plugin:/bot-plugin:ro
      - bot-pending:/link-pending:ro
    expose:
      - "25565/tcp"
      - "25575/tcp"

  pvp:
    <<: *paper
    profiles: ["pvp"]
    restart: "no"
    depends_on:
      craftcore-db:
        condition: service_healthy
    mem_limit: 1280m
    environment:
      <<: *paper-environment
      MEMORY: 768M
      USE_AIKAR_FLAGS: "true"
      CRAFTCORE_SERVER: pvp
      CRAFTCORE_DB_USER: craft_pvp
      # Zugang nur ueber Lobby-Zuweisung (pvp_assignments) oder craftcore.build.pvp; CraftCore-Join-Gate statt Whitelist
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      PVP: "true"
      SPAWN_PROTECTION: "0"
      CRAFTCORE_DB_PASSWORD: "${CRAFTCORE_PVP_DB_PASSWORD:-}"
      MOTD: MC Stack PvP
      LEVEL_TYPE: minecraft:flat
      GENERATOR_SETTINGS: '{"biome":"minecraft:the_void","layers":[],"structures":{}}'
      GENERATE_STRUCTURES: "FALSE"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "3"
      SPAWN_MONSTERS: "false"
      SPAWN_ANIMALS: "false"
      SPAWN_NPCS: "false"
      ALLOW_NETHER: "false"
      COPY_PLUGINS_SRC: /pvp-plugins
    volumes:
      - ./data/pvp:/data
      - ./config/lobby-paper:/config:ro
      - ./config/pvp-plugins:/pvp-plugins:ro
    expose:
      - "25565/tcp"

  vipworld-1:
    <<: *paper
    profiles: ["vip"]
    restart: "no"
    depends_on:
      craftcore-db:
        condition: service_healthy
    mem_limit: 1536m
    environment:
      <<: *paper-environment
      MEMORY: 1152M
      CRAFTCORE_SERVER: vipworld-1
      # Zugang ueber CraftCore-Join-Gate (Owner/Mitglieder/Bypass) statt Whitelist, wie pvp
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      CRAFTCORE_VIP_WORLD_ID: "${VIPWORLD_1_ID:-}"
      CRAFTCORE_DB_USER: craft_vip
      CRAFTCORE_DB_PASSWORD: "${CRAFTCORE_VIP_DB_PASSWORD:-}"
      MOTD: "MC Stack VIP 1"
      LEVEL: vipworld
      COPY_PLUGINS_SRC: /vip-plugins
      VIP_CONFIG: /config-vip/vipworlds.yml
    volumes:
      - ./data/vipworld-slots/vipworld-1:/data
      - ${VIPWORLD_1_DIR:-./data/vipworld-slots/empty-1}:/data/vipworld
      - ./config/lobby-paper:/config:ro
      - ./config/vip-plugins:/vip-plugins:ro
      - ./config/vipworlds.yml:/config-vip/vipworlds.yml:ro
    expose:
      - "25565/tcp"

  vipworld-2:
    <<: *paper
    profiles: ["vip"]
    restart: "no"
    depends_on:
      craftcore-db:
        condition: service_healthy
    mem_limit: 1536m
    environment:
      <<: *paper-environment
      MEMORY: 1152M
      CRAFTCORE_SERVER: vipworld-2
      # Zugang ueber CraftCore-Join-Gate (Owner/Mitglieder/Bypass) statt Whitelist, wie pvp
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      CRAFTCORE_VIP_WORLD_ID: "${VIPWORLD_2_ID:-}"
      CRAFTCORE_DB_USER: craft_vip
      CRAFTCORE_DB_PASSWORD: "${CRAFTCORE_VIP_DB_PASSWORD:-}"
      MOTD: "MC Stack VIP 2"
      LEVEL: vipworld
      COPY_PLUGINS_SRC: /vip-plugins
      VIP_CONFIG: /config-vip/vipworlds.yml
    volumes:
      - ./data/vipworld-slots/vipworld-2:/data
      - ${VIPWORLD_2_DIR:-./data/vipworld-slots/empty-2}:/data/vipworld
      - ./config/lobby-paper:/config:ro
      - ./config/vip-plugins:/vip-plugins:ro
      - ./config/vipworlds.yml:/config-vip/vipworlds.yml:ro
    expose:
      - "25565/tcp"

  vipworld-3:
    <<: *paper
    profiles: ["vip3"]
    restart: "no"
    depends_on:
      craftcore-db:
        condition: service_healthy
    mem_limit: 1536m
    environment:
      <<: *paper-environment
      MEMORY: 1152M
      CRAFTCORE_SERVER: vipworld-3
      # Zugang ueber CraftCore-Join-Gate (Owner/Mitglieder/Bypass) statt Whitelist, wie pvp
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      CRAFTCORE_VIP_WORLD_ID: "${VIPWORLD_3_ID:-}"
      CRAFTCORE_DB_USER: craft_vip
      CRAFTCORE_DB_PASSWORD: "${CRAFTCORE_VIP_DB_PASSWORD:-}"
      MOTD: "MC Stack VIP 3"
      LEVEL: vipworld
      COPY_PLUGINS_SRC: /vip-plugins
      VIP_CONFIG: /config-vip/vipworlds.yml
    volumes:
      - ./data/vipworld-slots/vipworld-3:/data
      - ${VIPWORLD_3_DIR:-./data/vipworld-slots/empty-3}:/data/vipworld
      - ./config/lobby-paper:/config:ro
      - ./config/vip-plugins:/vip-plugins:ro
      - ./config/vipworlds.yml:/config-vip/vipworlds.yml:ro
    expose:
      - "25565/tcp"

  survival:
    <<: *paper
    depends_on:
      craftcore-db:
        condition: service_healthy
    environment:
      <<: *paper-environment
      MEMORY: 4G
      CRAFTCORE_SERVER: Survival
      MC_INGEST_TOKEN: "${MC_INGEST_TOKEN:-}"
      VIP_WEB_QUEUE: "${VIP_WEB_QUEUE:-0}"
      MOTD: MC Stack Survival
      MODE: survival
      FORCE_GAMEMODE: "TRUE"
      DIFFICULTY: normal
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      MODRINTH_PROJECTS: "paper:simple-voice-chat"
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      COPY_PLUGINS_SRC: /plugins,/bot-plugin
    volumes:
      - ./data/survival:/data
      - ./config/paper:/config:ro
      - ./config/survival-plugins:/plugins:ro
      - bot-plugin:/bot-plugin:ro
    ports:
      - "127.0.0.1:24454:24454/udp"
    expose:
      - "25565/tcp"
      - "25575/tcp"
      - "24454/udp"

  velocity:
    image: itzg/mc-proxy:latest
    restart: unless-stopped
    environment:
      TYPE: VELOCITY
      CRAFTCORE_DB_PASSWORD: "${CRAFTCORE_DB_PASSWORD:?CRAFTCORE_DB_PASSWORD fehlt}"
      VELOCITY_VERSION: LATEST
      MEMORY: 512m
      SERVER_PORT: "25565"
      ENABLE_RCON: "FALSE"
      REPLACE_ENV_DURING_SYNC: "FALSE"
      SYNC_SKIP_NEWER_IN_DESTINATION: "FALSE"
      TZ: Europe/Berlin
      LUCKPERMS_STORAGE_METHOD: mariadb
      LUCKPERMS_DATA_ADDRESS: craftcore-db:3306
      LUCKPERMS_DATA_DATABASE: luckperms
      LUCKPERMS_DATA_USERNAME: "${LUCKPERMS_DB_USER:?LUCKPERMS_DB_USER fehlt}"
      LUCKPERMS_DATA_PASSWORD: "${LUCKPERMS_DB_PASSWORD:?LUCKPERMS_DB_PASSWORD fehlt}"
      LUCKPERMS_MESSAGING_SERVICE: sql
    ports:
      - "127.0.0.1:25565:25565/tcp"
    networks: [minecraft]
    secrets: [forwarding_secret]
    volumes:
      - ./data/velocity:/server
      - ./config/velocity:/config:ro
    depends_on:
      lobby:
        condition: service_healthy
      survival:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "127.0.0.1", "--port", "25565"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    profiles: [playit]
    restart: unless-stopped
    environment:
      SECRET_KEY: "${SECRET_KEY:-}"
    networks: [minecraft]
    depends_on:
      velocity:
        condition: service_healthy

  bot:
    build: ./bot
    profiles: [bot]
    restart: unless-stopped
    env_file:
      - path: ./bot/.env
        required: false
    environment:
      RCON_PASSWORD: "${RCON_PASSWORD:?RCON_PASSWORD fehlt in .env}"
      CRAFTCORE_DB_HOST: craftcore-db
      CREEPY_INV_DB_PASSWORD: "${CREEPY_INV_DB_PASSWORD:-}"
      MC_INGEST_TOKEN: "${MC_INGEST_TOKEN:-}"
    networks: [minecraft]
    volumes:
      - ./bot/data:/app/data
      - ./changelog-mc.json:/app/mc/changelog-mc.json:ro
      - ./data/lobby:/minecraft/lobby:ro
      - ./data/survival:/minecraft/survival:ro
      - bot-pending:/link-pending
      - bot-plugin:/plugin-output
    depends_on:
      velocity:
        condition: service_healthy

  # Remote MCP server for the Hermes agents (Claude Code / claude.ai).
  # Reachable only inside the compose network `mcp`: no published host port, no
  # router forwarding. The Hermes gateway is reached over
  # host.docker.internal, so this service needs no other compose network.
  # Public access is meant to go through Cloudflare Tunnel (see
  # tools/hermes-mcp/README.md), which is prepared but not created.
  hermes-mcp:
    build: ./tools/hermes-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    environment:
      HERMES_MCP_PORT: "8765"
      HERMES_MCP_HOST: "0.0.0.0"
      HERMES_BACKEND: "gateway"
      HERMES_GATEWAY_URL: "${HERMES_GATEWAY_URL:-http://host.docker.internal:8642}"
      HERMES_PROFILE_KEYS: "${HERMES_PROFILE_KEYS:-}"
      HERMES_MCP_TOKEN: "${HERMES_MCP_TOKEN:-}"
      HERMES_MCP_PUBLIC_URL: "${HERMES_MCP_PUBLIC_URL:-https://mcp.nwebnotfound.dev}"
      HERMES_MCP_ALLOWED_HOSTS: "${HERMES_MCP_ALLOWED_HOSTS:-mcp.nwebnotfound.dev,localhost,127.0.0.1,hermes-mcp}"
      HERMES_MCP_DATA_DIR: "/app/data"
      # Hardening (see tools/hermes-mcp/README.md):
      # - trust X-Forwarded-For only from these peers (empty = never);
      # - cap runs per UTC day and the accepted model/provider/effort overrides;
      # - stop a run that waits for approval, and time out lost (`unknown`) runs.
      HERMES_MCP_TRUSTED_PROXIES: "${HERMES_MCP_TRUSTED_PROXIES:-}"
      HERMES_MCP_MAX_RUNS_PER_DAY: "${HERMES_MCP_MAX_RUNS_PER_DAY:-50}"
      HERMES_MCP_LOCKOUT_AFTER: "${HERMES_MCP_LOCKOUT_AFTER:-5}"
      HERMES_MCP_LOCKOUT_SECONDS: "${HERMES_MCP_LOCKOUT_SECONDS:-300}"
      HERMES_MCP_APPROVAL_WAIT_SECONDS: "${HERMES_MCP_APPROVAL_WAIT_SECONDS:-900}"
      HERMES_MCP_UNKNOWN_TIMEOUT_SECONDS: "${HERMES_MCP_UNKNOWN_TIMEOUT_SECONDS:-7200}"
      HERMES_MCP_ALLOWED_MODELS: "${HERMES_MCP_ALLOWED_MODELS:-deepseek/deepseek-v4.1-flash,anthropic/claude-haiku-5.5}"
      HERMES_MCP_ALLOWED_PROVIDERS: "${HERMES_MCP_ALLOWED_PROVIDERS:-openrouter,anthropic}"
      HERMES_MCP_ALLOWED_REASONING_EFFORTS: "${HERMES_MCP_ALLOWED_REASONING_EFFORTS:-minimal,low,medium,high}"
      # Ops tools (see tools/ops-helper/README.md): this service holds NO Docker
      # socket. It asks the ops-helper service over the internal network `ops`
      # with a shared secret. Empty token = the ops tools are not advertised.
      OPS_HELPER_URL: "${OPS_HELPER_URL:-http://ops-helper:8766}"
      OPS_HELPER_TOKEN: "${OPS_HELPER_TOKEN:-}"
      OPS_HELPER_TIMEOUT_SECONDS: "${OPS_HELPER_TIMEOUT_SECONDS:-120}"
      # Second token level: T1/T2 ops tools require this token (fail closed when
      # unset). T2 additionally requires the local listener below.
      HERMES_MCP_OPS_TOKEN: "${HERMES_MCP_OPS_TOKEN:-}"
      # Local-only listener. It serves the T2 tools and is published on
      # 127.0.0.1 ONLY (see `ports`). The tunnel must never point at it.
      # It binds 0.0.0.0 inside the container (the port mapping needs that), so
      # it enforces "local only" itself: peers that are sibling containers on
      # hermes-mcp's own networks (cloudflared-mcp, anything else that joins
      # `mcp`) get 403, and only loopback Host headers are accepted
      # (HERMES_MCP_OPS_ALLOWED_HOSTS, default localhost,127.0.0.1,::1). If the
      # host's own requests are refused as `forbidden_peer`, set
      # HERMES_MCP_OPS_ALLOWED_PEERS to the logged address.
      HERMES_MCP_OPS_PORT: "${HERMES_MCP_OPS_PORT:-8767}"
      HERMES_MCP_OPS_LOCKOUT_AFTER: "${HERMES_MCP_OPS_LOCKOUT_AFTER:-3}"
      HERMES_MCP_OPS_ALLOWED_PEERS: "${HERMES_MCP_OPS_ALLOWED_PEERS:-}"
      HERMES_MCP_OPS_ALLOWED_HOSTS: "${HERMES_MCP_OPS_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [mcp, ops]
    ports:
      # Local T2 entry point: loopback only, never routed by cloudflared-mcp.
      - "127.0.0.1:${HERMES_MCP_OPS_PORT:-8767}:${HERMES_MCP_OPS_PORT:-8767}"
    # Only the tunnel-facing listener is meant for the compose networks; the
    # ops listener is reached through the 127.0.0.1 port mapping above.
    expose:
      - "8765/tcp"
    volumes:
      - ./data/hermes-mcp:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Privileged ops executor for hermes-mcp (see tools/ops-helper/README.md).
  #
  # It runs exactly the actions listed in config/ops-allowlist.json with fixed
  # argv lists (no shell, no free arguments), behind confirm/tier/armed/delay/
  # backup gates, and writes an append-only audit log. hermes-mcp reaches it only
  # over the internal network `ops` with the shared OPS_HELPER_TOKEN. It holds NO
  # raw Docker socket: the only socket holder is docker-socket-filter below.
  #
  # Profile "ops": nothing starts by itself, and T2 (game servers, deploys) stays
  # refused until OPS_ARMED=true. Start it explicitly:
  #   docker compose --profile ops --profile mcp up -d docker-socket-filter ops-helper hermes-mcp
  ops-helper:
    build: ./tools/ops-helper
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      OPS_HELPER_PORT: "8766"
      OPS_HELPER_HOST: "0.0.0.0"
      # Fail closed: without a token (>= 24 chars) the helper refuses to start.
      OPS_HELPER_TOKEN: "${OPS_HELPER_TOKEN:-}"
      # Global T2 arm switch and the kill switch (default: disarmed, enabled).
      OPS_ARMED: "${OPS_ARMED:-false}"
      OPS_DISABLED: "${OPS_DISABLED:-false}"
      OPS_REPO_DIR: "/repo"
      OPS_ALLOWLIST_PATH: "/repo/config/ops-allowlist.json"
      OPS_DATA_DIR: "/app/data/ops-helper"
      OPS_ARTIFACTS_DIR: "/artifacts"
      # Docker API access goes through docker-socket-filter (below), never
      # through a raw socket mount. The filter allowlists exact method+path
      # pairs (ps/inspect/logs and a restart of the exact names on its T1/T2
      # lists) and requires OPS_FILTER_TOKEN as a bearer token, which the
      # helper sends with every docker CLI call (private DOCKER_CONFIG on /tmp).
      # The filter lives on its own network `ops-docker`, shared ONLY with
      # this service.
      DOCKER_HOST: "tcp://docker-socket-filter:2375"
      OPS_FILTER_TOKEN: "${OPS_FILTER_TOKEN:-}"
      # Pinned on purpose: with an explicit API version the CLI skips
      # `GET /version`, which the filter refuses (it is not a route). Only
      # `HEAD /_ping` remains as the documented health/negotiation exception.
      DOCKER_API_VERSION: "1.51"
      # Named volumes (not host paths): build containers mount the same volume at
      # the same path, so no host path ever has to be guessed.
      OPS_ARTIFACTS_VOLUME: "mc-stack-ops-artifacts"
      OPS_GRADLE_CACHE_VOLUME: "mc-stack-ops-gradle-cache"
      OPS_NPM_CACHE_VOLUME: "mc-stack-ops-npm-cache"
      # Build/test jobs go through a shared volume to plugin-builder (below); the
      # helper never starts a container itself.
      OPS_JOBS_DIR: "/jobs"
      OPS_BUILDER_RESULTS_DIR: "/artifacts/builder"
      OPS_BUILDER_TIMEOUT_SECONDS: "${OPS_BUILDER_TIMEOUT_SECONDS:-1800}"
      OPS_ACTION_TIMEOUT_SECONDS: "${OPS_ACTION_TIMEOUT_SECONDS:-120}"
      OPS_BUILD_TIMEOUT_SECONDS: "${OPS_BUILD_TIMEOUT_SECONDS:-1800}"
    depends_on:
      - docker-socket-filter
      - plugin-builder
    volumes:
      # NO docker socket here: the helper talks to docker-socket-filter over TCP.
      # The repo IS mounted whole and read-only, on purpose - unlike
      # plugin-builder's narrow mount. `ops_git_state` runs `git status` over the
      # whole worktree, `ops_disk` runs `df` on the repo root and `du` on
      # /repo/data, and deploy/rollback reads /repo/backup.ps1, so narrowing it
      # would make git state lie (every unmounted file looks deleted) and `df`
      # report the container overlay instead of the repo filesystem. This service
      # is the trusted control plane (its trust level equals the repo's own code
      # - it can already restart game servers and write plugin jars); the
      # untrusted component that runs build commands is plugin-builder, and that
      # one is narrowed. See tools/ops-helper/README.md ("Why the repo mount is
      # not narrowed").
      - ./:/repo:ro
      # ...except the backup directory and the two plugin templates a deploy
      # writes into (nothing else in the repo is writable).
      - ./backups:/backups
      - ./config/lobby-plugins:/plugins/lobby
      - ./config/survival-plugins:/plugins/survival
      # Audit log, cooldown state and the DISABLED kill-switch file.
      - ./data/ops-helper:/app/data/ops-helper
      - ops-artifacts:/artifacts
      # The job channel to plugin-builder (jobs in, results back via /artifacts).
      - ops-jobs:/jobs
    networks: [ops, ops-docker]
    expose:
      - "8766/tcp"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Build/test worker for the ops tools (see tools/plugin-builder/README.md).
  #
  # It is a PERMANENT service so that a build no longer needs
  # `POST /containers/create` on the Docker socket (the filter refuses it, because
  # create is host root). ops-helper drops a job file into the shared `ops-jobs`
  # volume; this service validates it strictly, asserts the read-only repo is at
  # the requested commit, runs ONE fixed command from config/ops-allowlist.json
  # and writes the result into the artifact volume.
  #
  # Hardened hard on purpose: `network_mode: none` (no interface at all, so an
  # offline cache is the only source of dependencies), NO Docker socket, a
  # read-only rootfs, all capabilities dropped, no-new-privileges and explicit
  # CPU/RAM/PID caps so a build cannot starve the Minecraft servers.
  plugin-builder:
    build: ./tools/plugin-builder
    profiles: ["ops"]
    restart: unless-stopped
    network_mode: none
    environment:
      BUILDER_JOBS_DIR: "/jobs"
      BUILDER_ARTIFACTS_DIR: "/artifacts"
      BUILDER_RESULTS_DIR: "/artifacts/builder"
      BUILDER_REPO: "/repo"
      BUILDER_ALLOWLIST_PATH: "/repo/config/ops-allowlist.json"
      # Repo-relative roots the mounted read-only trees cover; a spec whose
      # `source` is not under one of them is refused (`source_not_mounted`).
      BUILDER_SOURCE_ROOTS: "plugins-src,tools"
      BUILDER_WORK_DIR: "/work"
      BUILDER_POLL_MS: "${OPS_BUILDER_POLL_MS:-1000}"
      BUILDER_JOB_TIMEOUT_SECONDS: "${OPS_BUILDER_TIMEOUT_SECONDS:-1800}"
      # The toolchains this image declares it can run; a build spec naming a
      # different image is refused rather than silently run on the wrong JDK.
      BUILDER_TOOLCHAINS: "gradle:9-jdk,node:22-alpine"
      GRADLE_USER_HOME: "/home/gradle/.gradle"
    volumes:
      # Deliberately NARROW and read-only: only the two source trees the
      # allowlist can build/test, the allowlist file itself and `.git` (which is
      # all `git archive`/`git status` need for the commit assertion and the
      # dirty count). The repo ROOT is NOT mounted, so `.env`, `secrets/` and
      # `data/` are not reachable from this service at all - a build must never
      # be able to read (or bake into a jar) anything but source code.
      - ./plugins-src:/repo/plugins-src:ro
      - ./tools:/repo/tools:ro
      - ./config/ops-allowlist.json:/repo/config/ops-allowlist.json:ro
      - ./.git:/repo/.git:ro
      # The only writable channels: the job volume (in) and the artifact volume.
      - ops-jobs:/jobs
      - ops-artifacts:/artifacts
      - ops-gradle-cache:/home/gradle/.gradle
      - ops-npm-cache:/root/.npm
    read_only: true
    tmpfs:
      - /tmp
      # The build happens on a copy of the source under /work, never in /repo.
      - /work:size=2g,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "1.5"
    mem_limit: 2g
    pids_limit: 512

  # The ONLY holder of the Docker socket (see tools/docker-socket-filter/README.md).
  #
  # A tiny, dependency-free Node filter written for this repo, replacing
  # tecnativa/docker-socket-proxy. That image filters by API *section*
  # (`CONTAINERS`, `POST`, `EXEC`, ...), and that granularity cannot express
  # "GET is fine, but only this one POST path, and only for these two container
  # names". Turning `POST=1` on there re-opens `/containers/create`, `/stop`,
  # `/kill` and `/exec` for the whole container API.
  #
  # Allowed (everything else is 403, including unknown methods and header
  # tricks): HEAD|GET /_ping, GET /containers/json (query: all, filters),
  # GET /containers/<ref>/json, GET /containers/<ref>/logs (tail REQUIRED,
  # <= 300) and POST /containers/<name>/restart for an EXACT name from
  # OPS_FILTER_RESTART_ALLOW (T1) or OPS_FILTER_RESTART_ALLOW_T2 (T2, the game
  # servers lobby/survival/velocity by default) - no ids, no prefixes, no globs.
  # Every request except /_ping needs `Authorization: Bearer $OPS_FILTER_TOKEN`
  # (constant-time compare; the filter refuses to start without a token).
  # The filter sits on its own internal network `ops-docker`, shared only with
  # ops-helper: hermes-mcp (the tunnel-facing service) cannot reach it at all.
  # The T1/T2 split, OPS_ARMED, confirm, delay and the backup gate are enforced
  # in ops-helper; the filter is the last line (token + exact names).
  docker-socket-filter:
    build: ./tools/docker-socket-filter
    profiles: ["ops"]
    restart: unless-stopped
    environment:
      OPS_FILTER_PORT: "2375"
      OPS_FILTER_HOST: "0.0.0.0"
      # Shared bearer token with ops-helper (>= 24 chars, openssl rand -hex 32).
      # Fail closed: without it the filter exits at startup.
      OPS_FILTER_TOKEN: "${OPS_FILTER_TOKEN:-}"
      OPS_FILTER_UPSTREAM: "/var/run/docker.sock"
      # Exact container names a restart may target, split by intent:
      #  - OPS_FILTER_RESTART_ALLOW     -> T1, reversible helper services;
      #  - OPS_FILTER_RESTART_ALLOW_T2  -> T2, the game servers.
      # Both apply to the exact `/containers/<name>/restart` path only, and the
      # union is what the filter accepts; the T1/T2 split is enforced by the
      # helper's own restart_t1 / restart_game lists (and its OPS_ARMED/confirm/
      # delay/backup gates). Set OPS_FILTER_RESTART_ALLOW_T2=none in .env to make
      # game-server restarts impossible at the filter level too (an empty value
      # falls back to the default). The database, the proxy DB, hermes-test, hermes-mcp and ops-helper
      # are in NEITHER list.
      OPS_FILTER_RESTART_ALLOW: "${OPS_FILTER_RESTART_ALLOW:-mc-stack-bot-1,mc-stack-cloudflared-mcp-1}"
      OPS_FILTER_RESTART_ALLOW_T2: "${OPS_FILTER_RESTART_ALLOW_T2:-mc-stack-lobby-1,mc-stack-survival-1,mc-stack-velocity-1}"
      # Hard cap on a forwarded response body (logs are the big one).
      OPS_FILTER_MAX_RESPONSE_BYTES: "${OPS_FILTER_MAX_RESPONSE_BYTES:-8388608}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ops-docker]
    expose:
      - "2375/tcp"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional dedicated tunnel for mcp.nwebnotfound.dev. Prepared only: start it
  # with `--profile mcp-tunnel` AFTER the tunnel exists in Cloudflare, its public
  # hostname points at http://hermes-mcp:8765 and HERMES_MCP_TUNNEL_TOKEN is in
  # .env. It runs in the `mcp` network (same network as hermes-mcp), so it needs
  # no published host port and no extra compose file; see tools/hermes-mcp/README.md.
  # See tools/hermes-mcp/cloudflared.config.example.yml for the local-config variant.
  cloudflared-mcp:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["mcp-tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${HERMES_MCP_TUNNEL_TOKEN:-}"
    networks: [mcp]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    networks: [minecraft]

networks:
  minecraft:
    driver: bridge
  # Dedicated network for hermes-mcp with a fixed name; the `cloudflared-mcp`
  # tunnel service runs in this same network, so no external compose file and no
  # `external: true` wiring is needed.
  mcp:
    name: mcp
  # Private network between hermes-mcp and ops-helper only.
  # `internal: true` means it has no route off the host: the helper cannot reach
  # the internet, and nothing outside these two services (in particular NOT
  # cloudflared-mcp, which lives only in `mcp`) can reach either of them here.
  ops:
    name: mc-stack-ops
    internal: true
  # Private network between ops-helper and docker-socket-filter ONLY. hermes-mcp
  # is deliberately not a member, so a compromised hermes-mcp cannot talk to the
  # socket filter directly (it would also need OPS_FILTER_TOKEN).
  ops-docker:
    name: mc-stack-ops-docker
    internal: true

volumes:
  craftcore-db:
  bot-plugin:
  bot-pending:
  # Build artifacts and the offline caches of the ops build/test path, plus the
  # job channel between ops-helper and plugin-builder.
  ops-artifacts:
  ops-gradle-cache:
  ops-npm-cache:
  ops-jobs:

secrets:
  forwarding_secret:
    file: ./secrets/forwarding.secret
